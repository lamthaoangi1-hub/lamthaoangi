<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12a150">
<meta name="robots" content="noindex, nofollow">
<title>Xác nhận đơn hàng – Lâm Thao Ăn Gì?</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#12a150;--gd:#0e8a43;--gl:#e6f6ec;--red:#e5322d;--or:#f08a1c;--ol:#fff3e0;--ink:#10131a;--ink2:#6b7280;--line:#e5e8ec;--bg:#f4f6f5}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{font-family:"Be Vietnam Pro",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.top{background:linear-gradient(112deg,#0e8a43,#12a150);color:#fff;padding:14px 16px;text-align:center}
.top b{font-family:"Baloo 2",system-ui,sans-serif;font-size:21px;letter-spacing:.2px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:8px}
.shop{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.muted{color:var(--ink2);font-size:13px}
.item{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .q{font-weight:800;color:var(--gd);min-width:28px}
.item .n{flex:1;overflow-wrap:anywhere}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.row.off b{color:var(--gd)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--line);margin-top:8px;padding-top:10px;font-size:17px;font-weight:800}
.total b{color:var(--gd);font-size:21px}
.loc{display:flex;gap:12px;align-items:center}
.loc .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--ol);flex:none}
.loc.ok .ic{background:var(--gl);color:var(--gd);font-weight:800}
.loc .tx{flex:1}
.loc .tx b{display:block}
label{display:block;font-weight:600;font-size:13.5px;color:#4b525c;margin-top:4px}
input[type=text]{width:100%;margin-top:5px;padding:12px;border:1px solid #d5dae0;border-radius:12px;background:#fff;font-size:16px}
input:focus{outline:2px solid var(--g);border-color:var(--g)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:14px;background:var(--g);color:#fff;font-weight:800;font-size:17px;box-shadow:0 10px 18px -10px rgba(18,161,80,.9)}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.55;box-shadow:none;cursor:not-allowed}
.btn.o{background:#fff;color:var(--gd);border:2px solid var(--g);box-shadow:none}
.btn.sm{width:auto;min-height:44px;padding:0 18px;font-size:15px}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:5}
.foot>div{max-width:520px;margin:0 auto}
.msg{text-align:center;padding:36px 16px}
.msg .big{font-size:54px;margin-bottom:8px}
.msg h1{font-size:20px;margin-bottom:6px}
.warn{background:var(--ol);color:#8a4b05;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.err{background:#fdeceb;color:var(--red);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.step{display:flex;gap:10px;align-items:center;color:var(--ink2)}
.step i{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-style:normal;font-size:13px;font-weight:800;flex:none}
.step.on{color:var(--ink);font-weight:700}.step.on i{background:var(--g);color:#fff}
.step.done i{background:var(--gl);color:var(--gd)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #fff5;border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#10131a;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="top"><b>Lâm Thao Ăn Gì?</b></div>
<div class="wrap" id="app"><div class="msg"><div class="big">⏳</div><p class="muted">Đang tải đơn hàng…</p></div></div>
<div id="foot" class="foot" hidden><div id="foot-in"></div></div>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="dat.js?v=20261112a"></script>
</body>
</html>
