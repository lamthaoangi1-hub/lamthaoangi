<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12a150">
<meta name="robots" content="noindex">
<title>Đăng nhập quản lý</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="panel.css?v=20261031c">
<script>
/* Khóa zoom: iOS Safari bỏ qua user-scalable=no nên chặn thêm cử chỉ chụm 2 ngón; double-tap đã tắt bằng touch-action:manipulation */
['gesturestart','gesturechange','gestureend'].forEach(function(t){document.addEventListener(t,function(e){e.preventDefault();},{passive:false});});
document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1&&e.cancelable)e.preventDefault();},{passive:false});
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="quanly.js?v=20261031c"></script>
</body>
</html>
